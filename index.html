<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>点群ビューア (LAS / LAZ / COPC)</title>
    <style>
      :root {
        --bg: #14161b;
        --panel: #1f2229;
        --panel2: #262a33;
        --border: #363b47;
        --text: #e6e8ee;
        --muted: #9aa0ad;
        --accent: #4f9cf9;
        --danger: #f06262;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
      #panel { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      #panel h1 { font-size: 15px; margin: 0 0 4px; }
      #view { position: relative; min-width: 0; }
      #view canvas { width: 100%; height: 100%; display: block; }
      details { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px 8px; }
      details > summary { cursor: pointer; font-weight: 600; padding: 8px 0; list-style: none; user-select: none; }
      details > summary::before { content: '▸ '; color: var(--muted); }
      details[open] > summary::before { content: '▾ '; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
      .row label { min-width: 84px; color: var(--muted); }
      .row input[type=range] { flex: 1; min-width: 80px; }
      .row input[type=number], .row input[type=text], .row select { flex: 1; min-width: 60px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font: inherit; }
      .row .val { min-width: 48px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.active { background: #2a4a75; border-color: var(--accent); }
      button.danger { color: var(--danger); }
      button:disabled { opacity: .5; cursor: default; }
      .drop { border: 2px dashed var(--border); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); cursor: pointer; }
      .drop.over { border-color: var(--accent); color: var(--text); }
      .layer { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 6px; background: var(--bg); margin: 4px 0; }
      .layer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .layer .meta { color: var(--muted); font-size: 11px; }
      .layer progress { width: 100%; height: 6px; }
      .small { color: var(--muted); font-size: 11px; }
      #status { position: absolute; left: 12px; bottom: 10px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; font-size: 12px; pointer-events: none; max-width: 70%; }
      #coord { position: absolute; right: 12px; bottom: 10px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }
      #toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
      #toolbar button { background: rgba(31,34,41,.9); }
      #drop-overlay { position: absolute; inset: 0; background: rgba(79,156,249,.15); border: 3px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 20px; pointer-events: none; }
      #drop-overlay.show { display: flex; }
      #walk-hint { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 6px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; white-space: nowrap; }
      #attribution { position: absolute; right: 12px; top: 10px; font-size: 11px; color: var(--muted); background: rgba(0,0,0,.4); padding: 2px 6px; border-radius: 4px; }
      .error { color: var(--danger); }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="panel"></aside>
      <main id="view">
        <canvas id="canvas" tabindex="0"></canvas>
        <div id="toolbar"></div>
        <div id="attribution"></div>
        <div id="status">LAS / LAZ ファイルをドラッグ＆ドロップ、または左のパネルから開いてください</div>
        <div id="coord"></div>
        <div id="drop-overlay">ここにドロップして読み込み</div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
